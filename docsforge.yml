site_name: Lemma
site_url: https://lemmas.pages.dev/
site_description: A rigorous mathematical wiki. Every definition is precise. Every
  theorem is proved.
site_author: QQ
repo_name: QQSHI13/lemma
repo_url: https://github.com/QQSHI13/lemma
edit_uri: https://lemmas.pages.dev/edit-landing/?ref=
copyright: Copyright © 2025–2026 QQ. Licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC
  BY-SA 4.0</a>.
theme:
  name: material
  favicon: assets/images/favicon.svg
  icon:
    logo: fontawesome/solid/graduation-cap
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - search.highlight
  - search.share
  - search.suggest
  - toc.follow
  - content.action.edit
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: teal
    accent: teal
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: black
    accent: teal
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
tikz: true
plugins:
  i18n:
    languages:
      - locale: en
        name: English
        default: true
      - locale: zh
        name: 中文
        site_name: Lemma 数学百科
        site_description: 一本严谨的数学维基
    docs_structure: suffix
    fallback_to_default: true

extra_css:
- assets/css/lemma.css
markdown_extensions:
- plugins.lemma_md
- pymdownx.arithmatex:
    generic: true
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed
- pymdownx.critic
- pymdownx.magiclink
- pymdownx.keys
- pymdownx.mark
- pymdownx.tilde
- pymdownx.tasklist
- pymdownx.betterem
- pymdownx.caret
- pymdownx.smartsymbols
- pymdownx.emoji
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.pathconverter
- pymdownx.b64
- pymdownx.blocks.caption
- footnotes
- def_list
- abbr
- attr_list
- md_in_html
- meta

hooks:
- plugins/build_concepts_hook.py
- plugins/auto_nav_hook.py
- plugins/prerequisites_hook.py
- plugins/backlinks_hook.py
extra:
  lemma:
    enabled: true
    areas:
    - foundations
    - number-systems
    - algebra
    - analysis
    - geometry
    - number-theory
    - discrete-mathematics
    - calculus
    - probability
    - applied-mathematics
