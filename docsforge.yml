site_name: Lemma
site_url: https://qqshi13.github.io/lemma/
site_description: A mathematics wiki built with DocsForge
site_author: QQ (Cyrus)

repo_name: QQSHI13/lemma
repo_url: https://github.com/QQSHI13/lemma

copyright: Copyright &copy; 2026 QQ (Cyrus)

theme:
  name: material
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Enable TikZ diagram compilation
tikz: true

nav:
  - Home: index.md
  - Algebra: algebra/index.md
  - Calculus: calculus/index.md
  - Geometry: geometry/index.md
  - Number Theory: number-theory/index.md
  - TikZ Gallery: tikz-gallery.md
