site_name: Lemma
site_url: https://lemmas.pages.dev
site_description: A rigorous mathematical wiki. Every definition is precise. Every theorem is proved.
site_author: QQ (Cyrus)

repo_name: QQSHI13/lemma
repo_url: https://github.com/QQSHI13/lemma

copyright: Copyright &copy; 2026 QQ (Cyrus). Licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.

theme:
  name: material
  favicon: assets/images/favicon.svg
  icon:
    logo: fontawesome/solid/graduation-cap
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

tikz: true

extra_css:
  - assets/css/lemma.css

# Lemma custom markdown extension
# Adds [[ref:Page Title]], [[thm:label]], [[eq:label]], {#thm:label} syntax
markdown_extensions:
  - plugins.lemma_md
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.critic
  - pymdownx.magiclink
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.smartsymbols
  - pymdownx.emoji
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.pathconverter
  - pymdownx.b64
  - pymdownx.blocks.caption
  - footnotes
  - def_list
  - abbr
  - attr_list
  - md_in_html
  - meta

nav:
  - Home: index.md
  - Foundations:
    - foundations/index.md
    - Proposition: foundations/proposition.md
    - Set: foundations/set.md
    - Element: foundations/element.md
    - Subset: foundations/subset.md
    - Union: foundations/union.md
    - Intersection: foundations/intersection.md
    - Logical Connective: foundations/logical-connective.md
    - Direct Proof: foundations/direct-proof.md
  - Number Systems:
    - number-systems/index.md
  - Algebra:
    - algebra/index.md
  - Analysis:
    - analysis/index.md
  - Geometry:
    - geometry/index.md
    - Pythagorean Theorem: geometry/pythagorean.md
  - Number Theory:
    - number-theory/index.md
  - Calculus:
    - calculus/index.md
    - Fundamental Theorem: calculus/fundamental-theorem.md
  - Discrete Math:
    - discrete-mathematics/index.md
  - Probability:
    - probability/index.md

extra:
  lemma:
    enabled: true
# Theme overrides for Lemma
