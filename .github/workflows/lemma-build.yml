name: Lemma Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Lemma Wiki
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml
          pip install docsforge

      - name: Validate links and frontmatter
        run: python scripts/check_links.py

      - name: Build docs
        run: docsforge build
