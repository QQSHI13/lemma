name: Lemma Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Lemma Wiki
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml
          pip install docsforge

      - name: Validate concepts.json
        run: python scripts/lemma_pipeline.py --validate

      - name: Check quality scores
        run: |
          python scripts/lemma_pipeline.py --quality-check

      - name: Check all links
        run: python scripts/check_links.py

      - name: Check notation consistency
        run: python scripts/lemma_pipeline.py --notation-check

      - name: Generate dashboard
        run: python scripts/lemma_pipeline.py --dashboard

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemma-dashboard
          path: site/dashboard.html
