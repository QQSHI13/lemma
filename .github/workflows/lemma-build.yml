name: Lemma Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Lemma Wiki
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml
          pip install docsforge

      # The cache key must include the installed docsforge version: docsforge
      # is installed unpinned (latest), and a version bump changes the theme
      # templates and thus the build's stored theme signature. If the key only
      # covered repo files (docsforge.yml, plugins, templates, scripts), a
      # version upgrade would leave the key unchanged, restore the stale
      # previous-version cache on every run, and then fail to save the rebuilt
      # cache because the key already exists — so the cache could never update.
      # Keying on the version gives a fresh key on every upgrade; the
      # version-scoped restore-keys fallback still lets content-only changes
      # (docs/** edits, which don't affect the key) hit the same-version cache
      # and build incrementally.
      - name: Compute cache key
        id: cache-key
        run: |
          VER=$(python -c "import docsforge; print(docsforge.__version__)")
          echo "docsforge-version=$VER" >> "$GITHUB_OUTPUT"
          echo "key=lemma-site-${{ runner.os }}-$VER-${{ hashFiles('docsforge.yml', 'plugins/**', '!plugins/**/__pycache__/**', 'templates/**', 'scripts/**', 'pyproject.toml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .docsforge/cache
            site
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            lemma-site-${{ runner.os }}-${{ steps.cache-key.outputs.docsforge-version }}-
            lemma-site-${{ runner.os }}-

      - name: Install LaTeX for TikZ
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-pictures dvisvgm

      - name: Build docs
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: docsforge build

      # Save the cache right after a successful build (before the unrelated
      # link/frontmatter validation, which may fail on content issues and
      # would otherwise skip the cache post-step).
      - name: Save build cache
        if: success()
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .docsforge/cache
            site
          key: ${{ steps.cache-key.outputs.key }}

      - name: Validate links and frontmatter
        run: python scripts/check_links.py