name: Lemma Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Lemma Wiki
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      # Restore the incremental-build cache (source hashes + previous site
      # output) so `docsforge build` rebuilds only changed pages/diagrams.
      # The key covers only build-affecting inputs (not docs/**): content
      # changes fall through to restore-keys and hit the hash-based
      # incremental build instead of a full rebuild. Plugin/template changes
      # bust the key for a clean rebuild (plugin code isn't hash-tracked).
      # `!**/__pycache__/**` is required: hashFiles ignores .gitignore and
      # importing plugins during the build creates __pycache__/*.pyc, whose
      # bytes embed per-checkout source mtimes — the key would differ on
      # every run and no cache would ever be reused.
      - name: Restore build cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .docsforge/cache
            site
          key: lemma-site-${{ runner.os }}-${{ hashFiles('docsforge.yml', 'plugins/**', '!plugins/**/__pycache__/**', 'templates/**', 'scripts/**', 'pyproject.toml') }}
          restore-keys: |
            lemma-site-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install pyyaml
          pip install docsforge
          
      - name: Install LaTeX for TikZ
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-pictures dvisvgm

      - name: Debug cache state
        run: |
          python - <<'EOF'
          import json, os, hashlib, pathlib
          from docsforge.cache import CacheManager, FileHasher, BuildPlanner
          p = BuildPlanner(CacheManager(pathlib.Path('.docsforge/cache')), FileHasher())
          print("cached pkg_version:", repr(p.pkg_version))
          print("cached config_hash:", repr(p.config_hash))
          print("cached theme_sig:", repr(p.theme_sig))
          print("current pkg_version:", __import__('docsforge').__version__)
          import docsforge
          try:
            cfg = __import__('yaml').safe_load(open('docsforge.yml'))
          except Exception as e:
            print("config read error:", e)
          th = pathlib.Path(__import__('docsforge').__file__).parent / 'templates'
          sig = p.theme_signature([str(th)])
          print("computed theme_sig:", sig)
          ch = p.hasher.hash_file(pathlib.Path('docsforge.yml'))
          print("computed config_hash:", ch)
          EOF
        shell: bash
      - name: Build docs
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: docsforge build

      # Save the cache right after a successful build (before the unrelated
      # link/frontmatter validation, which may fail on content issues and
      # would otherwise skip the cache post-step).
      - name: Save build cache
        if: success()
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .docsforge/cache
            site
          key: lemma-site-${{ runner.os }}-${{ hashFiles('docsforge.yml', 'plugins/**', '!plugins/**/__pycache__/**', 'templates/**', 'scripts/**', 'pyproject.toml') }}

      - name: Validate links and frontmatter
        run: python scripts/check_links.py