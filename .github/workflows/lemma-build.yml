name: Lemma Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Lemma Wiki
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      # Restore the incremental-build cache (source hashes + previous site
      # output) so `docsforge build` rebuilds only changed pages/diagrams.
      # The key covers only build-affecting inputs (not docs/**): content
      # changes fall through to restore-keys and hit the hash-based
      # incremental build instead of a full rebuild. Plugin/template changes
      # bust the key for a clean rebuild (plugin code isn't hash-tracked).
      - name: Restore build cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            .docsforge/cache
            site
          key: lemma-site-${{ runner.os }}-${{ hashFiles('docsforge.yml', 'plugins/**', 'templates/**', 'scripts/**', 'pyproject.toml') }}
          restore-keys: |
            lemma-site-${{ runner.os }}-
          # The validate job can fail on content issues (check_links.py)
          # unrelated to the build; still save the cache so incremental
          # builds work on the next run.
          save-always: true

      - name: Install dependencies
        run: |
          pip install pyyaml
          pip install docsforge
          
      - name: Install LaTeX for TikZ
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-pictures dvisvgm

      - name: Build docs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: docsforge build

      - name: Validate links and frontmatter
        run: python scripts/check_links.py
