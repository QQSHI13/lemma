name: Lemma Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Lemma Wiki
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml
          pip install docsforge
          
      - name: Install LaTeX for TikZ
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-pictures dvisvgm

      - name: Build docs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: docsforge build

      - name: Validate links and frontmatter
        run: python scripts/check_links.py
