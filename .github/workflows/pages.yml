name: Deploy Lemma to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install DocsForge
        run: pip install docsforge

      - name: Install Lemma plugins
        run: pip install -e .

      - name: Install LaTeX (for TikZ)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-pictures dvisvgm

      - name: Build site
        run: docsforge build

      - name: Resolve cross-references
        run: python3 postbuild.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
